name: Android CI

on:
  push:
    branches:
      - shaverse-v2-upgrade

  pull_request:
    branches:
      - shaverse-v2-upgrade

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:

      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
